"$schema" = 'https://starship.rs/config-schema.json'

format = "$directory$username$hostname$character"
right_format = "$vcs$all$time"

# Disable git in favour of jj. This keeps git out of `$all` and therefore
# doesn't render jj *and*. `$vcs` still renders git when there's no jj.
git_branch.disabled = true
git_branch.symbol = "󰊢 "
git_commit.disabled = true
git_state.disabled = true
git_status.disabled = true

gcloud.disabled = true

add_newline = false

# Default is 500ms, which jj sometimes exceeds in larger repos.
command_timeout = 1000

[time]
disabled = false
format = "[$time]($style)"
time_format = "%R"
style = "italic dimmed white"

[directory]
truncation_length = 5
fish_style_pwd_dir_length = 1
truncation_symbol = "…/"
read_only = " 󰌾" # Instead of the emoji

[vcs]
order = ["jj", "git", "hg", "pijul", "fossil"] # jj has prio over git
# Change first so the jj symbol shows even without a bookmark
jj_modules = "$jj_change$jj_bookmark$jj_metrics$jj_status"

[jj_change]
format = "on [󱗆 ](blue)$change "
prefix_style = "bold purple"

[jj_bookmark]
# Include the symbol even if there's no bookmark
format = '[$bookmark(@$remote)$diverged( \(+$overflow_count others\))]($style) '

[jj_metrics]
# Don't put spaces between the add/deleted numbers
format = "(([+$added]($added_style))([-$deleted]($deleted_style)) )"

[jj_status]
format = '([$all]($style) )'
conflicted = "×"
immutable = "◆"
hidden = "󰈉"
description_empty = "[󱗢 ](bold green)"
added = " "
copied = " "
deleted = " "
modified = " "
renamed = " "

