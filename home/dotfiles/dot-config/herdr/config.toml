onboarding = false
[theme]
name = "one-dark"

[terminal]
default_shell = "fish"

[update]
version_check = false

[keys]
prefix = "ctrl+space"

# keep-sorted start
close_pane = ["prefix+c", "prefix+ctrl+c"]
close_tab = "prefix+alt+w"
close_workspace = "prefix+C"
focus_agent = "prefix+alt+1..9"
focus_pane_down = ["prefix+j", "prefix+ctrl+j"]
focus_pane_left = ["prefix+h", "prefix+ctrl+h"]
focus_pane_right = ["prefix+l", "prefix+ctrl+l"]
focus_pane_up = ["prefix+k", "prefix+ctrl+k"]
move_tab_next = "prefix+>"
move_tab_previous = "prefix+<"
new_tab = "prefix+n"
next_tab = "prefix+alt+l"
previous_tab = "prefix+alt+h"
settings = "prefix+,"
split_horizontal = ["prefix+s", "prefix+ctrl+s"]
split_vertical = ["prefix+v", "prefix+ctrl+v"]
switch_workspace = "prefix+shift+1..9"
toggle_sidebar = "prefix+`"
zoom = "prefix+f"
# keep-sorted end

[ui]
sidebar_start_collapsed = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "system"

[advanced]
scrollback_limit_bytes = 50000000

[experimental]
kitty_graphics = true
pane_history = true
