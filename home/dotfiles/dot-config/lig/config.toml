[ui]
theme = "terminal"
border = "none"
density = "compact"
min_width = 80
height = "50%"

[keys]
accept = ["ctrl-i"]
toggle = ["alt-space"] # herdr's prefix is ctrl+space
next = ["tab", "down", "ctrl-j"]
prev = ["shift-tab", "up", "ctrl-k"]
dismiss = []

[behavior]
complete_commands = true
# Leaves Ctrl+R to atuin
history = false

[colors]
# The terminal theme has no background, so use the palette's black
bg = "0"
selected_description_fg = "0"
